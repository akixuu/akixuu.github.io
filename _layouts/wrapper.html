<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7S0SFN1LFP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-7S0SFN1LFP');
  </script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>

  <!-- Apply theme before paint to avoid flash -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var theme = stored || 'dark';
        document.documentElement.setAttribute('data-bs-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-bs-theme', 'dark');
      }
    })();
  </script>

  <!-- Mouse Follower -->
  <link rel="stylesheet" href="https://unpkg.com/mouse-follower@1/dist/mouse-follower.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"></script>
  <script src="https://unpkg.com/mouse-follower@1/dist/mouse-follower.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.css">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{{ '/' | relative_url }}" />
</head>

<body class="{% if page.layout == 'home' %}home-page{% else %}inner-page{% endif %}">
  <script>document.documentElement.classList.add("js");</script>
  {{ content }}

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/51e1f7ac6b.js" crossorigin="anonymous"></script>

  <!-- Theme toggle -->
  <script>
    (function () {
      var toggle = document.getElementById('theme-toggle');
      if (!toggle) return;

      function currentTheme() {
        return document.documentElement.getAttribute('data-bs-theme') || 'dark';
      }

      function setTheme(theme) {
        document.documentElement.setAttribute('data-bs-theme', theme);
        try { localStorage.setItem('theme', theme); } catch (e) {}
        toggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
      }

      toggle.addEventListener('click', function () {
        document.documentElement.classList.add('theme-animating');
        setTheme(currentTheme() === 'dark' ? 'light' : 'dark');
        window.setTimeout(function () {
          document.documentElement.classList.remove('theme-animating');
        }, 400);
      });

      setTheme(currentTheme());
    })();
  </script>

  <!-- Mouse Follower -->
  <script>
    if (window.MouseFollower) {
      new MouseFollower({
        container: 'body',
        speed: 0.3
      });
    }
  </script>

  <!-- Smooth scrolling -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
  <script>
    (function () {
      if (!window.Lenis) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var lenis = new Lenis({
        lerp: 0.135,
        wheelMultiplier: 1.1,
        anchors: true
      });

      if (window.gsap) {
        gsap.ticker.add(function (time) {
          lenis.raf(time * 1000);
        });
        gsap.ticker.lagSmoothing(0);
      } else {
        function raf(time) {
          lenis.raf(time);
          requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);
      }

      document.addEventListener('show.bs.modal', function () { lenis.stop(); });
      document.addEventListener('hidden.bs.modal', function () { lenis.start(); });
    })();
  </script>

  <!-- Scroll reveal -->
  <script>
    (function () {
      var reveals = document.querySelectorAll("[data-reveal]");
      if (!reveals.length) return;
      if (!window.IntersectionObserver || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        reveals.forEach(function (el) { el.classList.add("is-in"); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          entry.target.classList.add("is-in");
          io.unobserve(entry.target);
        });
      }, { rootMargin: "0px 0px -8% 0px", threshold: 0.01 });
      reveals.forEach(function (el) { io.observe(el); });
    })();
  </script>

  <!-- Photo gallery lightbox -->
  <script src="{{ '/assets/js/gallery.js' | relative_url }}" defer></script>
</body>

</html>
