why: >-
  This summer, I am spending thirty days in Blender!
  I want to make games and interesting 3.js animations at some point, 
  so I want to be able to create my own assets. It's a useful skill and
  a fun challenge. Between work and school, I will spend an hour a day.
goals:
  - Finish one render per day
  - Become good enough where I can make simple assets for games & animations 

